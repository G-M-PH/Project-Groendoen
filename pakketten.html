<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header id="header"></header>
    <main>
                <section class="form-section">
            <div class="card form-card">
                <h2>Bestelling plaatsen</h2>
                <form id="orderForm">
                    
                    <div class="form-group">
                        <label for="name">Naam:</label>
                        <input type="text" id="name" placeholder="Uw naam" required>
                    </div>

                    <div class="form-group">
                        <label for="address">Adres:</label>
                        <input type="text" id="address" placeholder="Straat en huisnummer" required>
                    </div>

                    <div class="form-group">
                        <label for="zipcity">Postcode & Plaats:</label>
                        <input type="text" id="zipcity" placeholder="1234AB Plaats" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="email">E-mail:</label>
                            <input type="email" id="email" placeholder="Voor bevestiging" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">Telefoon:</label>
                            <input type="tel" id="phone" placeholder="Voor overleg" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="date">Voorkeursdatum:</label>
                        <input type="date" id="date" required>
                        <small>Let op: Henk moet deze datum nog goedkeuren.</small>
                    </div>

                    <div class="form-group">
                        <label for="packageSelect">Kies uw pakket:</label>
                        <select id="packageSelect" required>
                            <option value="">-- Even geduld, laden... --</option>
                            </select>
                    </div>

                    <button type="submit" class="btn-green">Aanvraag Versturen</button>
                </form>
            </div>
        </section>
    </main>
    <footer id="footer"></footer>
        <script src="scripts/functions.js"></script>
    <script src="scripts/script.js"></script>
</body>
</html>
