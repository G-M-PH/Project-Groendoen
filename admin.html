    <main class="container">
        <h1>Admin Dashboard</h1>



        <section class="card">
            <h2>Pakketbeheer (snel aanpassen)</h2>
            <div id="packagesEditor">
                <div id="packagesList">Laden...</div>

                <h3>Nieuw pakket toevoegen</h3>
                <form id="addPackageForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="pkgName">Naam</label>
                            <input id="pkgName" required />
                        </div>
                        <div class="form-group">
                            <label for="pkgHours">Uren</label>
                            <input id="pkgHours" type="number" min="0" required />
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="pkgPrice">Totaal prijs (€)</label>
                            <input id="pkgPrice" type="number" min="0" step="0.01" required />
                        </div>
                        <div class="form-group">
                            <label for="pkgDesc">Omschrijving</label>
                            <input id="pkgDesc" />
                        </div>
                    </div>
                    <button type="submit" class="btn-green">Toevoegen</button>
                </form>
            </div>
        </section>
    </main>
